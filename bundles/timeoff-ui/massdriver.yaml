name: timeoff-ui
description: The time-off web app. Static files served by nginx, calling timeoff-api and payroll-api on your hostname.
source_url: https://github.com/massdriver-cloud/onsite-aws-developer-catalog-092026/tree/main/bundles/timeoff-ui
version: 0.0.0

steps:
  - path: src
    provisioner: opentofu

dependencies:
  landing_zone:
    resource_type: landing-zone@~1
    required: true
  timeoff_api:
    resource_type: api-endpoint@0.0.0
    required: true
  payroll_api:
    resource_type: api-endpoint@0.0.0
    required: false

resources:
  site:
    resource_type: api-endpoint@0.0.0
    required: true

params:
  examples:
    - __name: Small
      image:
        repository: docker.io/coryodaniel/hr-workshop-timeoff-ui
        tag: "1.0.0"
      replicas: 1
      resources:
        cpu: 0.1
        memory_mb: 64
  required:
    - image
    - replicas
    - resources
  properties:
    image:
      title: Container image
      type: object
      required:
        - repository
        - tag
      properties:
        repository:
          title: Repository
          type: string
          default: docker.io/coryodaniel/hr-workshop-timeoff-ui
          pattern: ^[a-z0-9./_-]+$
          message:
            pattern: A registry path such as docker.io/acme/timeoff-ui, without a tag.
        tag:
          title: Tag
          type: string
          default: "1.0.0"
          pattern: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$
          message:
            pattern: A plain image tag, for example 1.0.0.
    replicas:
      title: Replicas
      type: integer
      minimum: 1
      maximum: 5
      default: 1
    resources:
      title: Resources per replica
      type: object
      required:
        - cpu
        - memory_mb
      properties:
        cpu:
          title: CPU cores
          type: number
          minimum: 0.05
          maximum: 1
          default: 0.1
        memory_mb:
          title: Memory (MB)
          type: integer
          minimum: 32
          maximum: 512
          default: 64

app:
  envs:
    NAMESPACE: .dependencies.landing_zone.prefix
    BASE_PATH: '@text ""'
    TIMEOFF_API_URL: .dependencies.timeoff_api.url | rtrimstr("/")
    PAYROLL_API_URL: (.dependencies.payroll_api.url // "") | rtrimstr("/")

ui:
  ui:order:
    - image
    - replicas
    - resources
    - "*"
  image:
    ui:order:
      - repository
      - tag
  replicas:
    ui:widget: updown
  resources:
    ui:order:
      - cpu
      - memory_mb
