# Stands in for the cluster ingress: one host, routing by path prefix, no rewrites.
server {
    listen 80;

    location /local/api/timeoff {
        proxy_pass http://timeoff-api:8080;
        proxy_set_header Host $host;
    }

    location /local/api/payroll {
        proxy_pass http://payroll-api:8080;
        proxy_set_header Host $host;
    }

    location /local/ {
        proxy_pass http://timeoff-ui:8080;
        proxy_set_header Host $host;
    }

    location = / {
        return 302 /local/;
    }
}
