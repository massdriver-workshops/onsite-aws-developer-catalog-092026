name: timeoff-api
description: Time-off requests and approvals. Owns its database and publishes a decision event for payroll on every approval or denial.
source_url: https://github.com/massdriver-cloud/onsite-aws-developer-catalog-092026/tree/main/bundles/timeoff-api
version: 1.0.0

steps:
  - path: src
    provisioner: opentofu

dependencies:
  landing_zone:
    resource_type: landing-zone@~1
    required: true
  mariadb:
    resource_type: mariadb-authentication@0.0.0
    required: true
  kafka:
    resource_type: kafka-authentication@0.0.0
    required: true

params:
  examples:
    - __name: Small
      image:
        repository: docker.io/coryodaniel/hr-workshop-timeoff-api
        tag: "1.0.0"
      replicas: 1
      resources:
        cpu: 0.25
        memory_mb: 256
      path: /api/timeoff
      max_days_per_request: 30
      approval:
        auto_approve: false
        window_days: 5
    - __name: Medium
      image:
        repository: docker.io/coryodaniel/hr-workshop-timeoff-api
        tag: "1.0.0"
      replicas: 2
      resources:
        cpu: 0.5
        memory_mb: 512
      path: /api/timeoff
      max_days_per_request: 30
      approval:
        auto_approve: false
        window_days: 5
  required:
    - image
    - replicas
    - resources
    - path
    - events_topic
    - max_days_per_request
    - approval
  properties:
    image:
      title: Container image
      type: object
      required:
        - repository
        - tag
      properties:
        repository:
          title: Repository
          type: string
          default: docker.io/coryodaniel/hr-workshop-timeoff-api
          pattern: ^[a-z0-9./_-]+$
          message:
            pattern: A registry path such as docker.io/acme/timeoff-api, without a tag.
        tag:
          title: Tag
          type: string
          default: "1.0.0"
          pattern: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$
          message:
            pattern: A plain image tag, for example 1.0.0.
    replicas:
      title: Replicas
      type: integer
      minimum: 1
      maximum: 5
      default: 1
    resources:
      title: Resources per replica
      type: object
      required:
        - cpu
        - memory_mb
      properties:
        cpu:
          title: CPU cores
          type: number
          minimum: 0.1
          maximum: 2
          default: 0.25
        memory_mb:
          title: Memory (MB)
          type: integer
          minimum: 128
          maximum: 2048
          default: 256
    path:
      $md.immutable: true
      title: Path
      description: Served under your hostname. Cannot change after the first deploy because the UI is configured against it.
      type: string
      default: /api/timeoff
      pattern: ^/[a-z0-9][a-z0-9/-]*[a-z0-9]$
      message:
        pattern: Starts with a slash, lowercase letters, digits, and hyphens, no trailing slash.
    events_topic:
      title: Events topic
      description: Where decision events are published. Payroll consumes this topic.
      type: string
      $md.enum:
        connection: kafka
        options: .topics[]
        value: .name
        label: '"\(.name) - \(.description)"'
    max_days_per_request:
      title: Maximum days per request
      description: Requests covering more consecutive days than this are rejected.
      type: integer
      minimum: 1
      maximum: 90
      default: 30
    approval:
      title: Approval policy
      type: object
      properties:
        auto_approve:
          title: Approve requests automatically
          type: boolean
          default: false
      dependencies:
        auto_approve:
          oneOf:
            - properties:
                auto_approve:
                  const: true
            - properties:
                auto_approve:
                  const: false
                window_days:
                  title: Decision window (days)
                  description: Pending requests older than this are flagged as overdue.
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 5
              required:
                - window_days

app:
  envs:
    NAMESPACE: .dependencies.landing_zone.prefix
    BASE_PATH: .params.path
    DATABASE_URL: .dependencies.mariadb.dsn
    DATABASE_CA_BUNDLE: .dependencies.mariadb.tls.ca_bundle
    KAFKA_BROKERS: .dependencies.kafka.bootstrap_brokers | join(",")
    KAFKA_TOPIC: .params.events_topic
    KAFKA_USERNAME: .dependencies.kafka.auth.username
    KAFKA_PASSWORD: .dependencies.kafka.auth.password
    KAFKA_SASL_MECHANISM: .dependencies.kafka.auth.mechanism
    KAFKA_TLS: .dependencies.kafka.auth.tls | tostring
    MAX_DAYS_PER_REQUEST: .params.max_days_per_request | tostring
    AUTO_APPROVE: .params.approval.auto_approve | tostring
    APPROVAL_WINDOW_DAYS: (.params.approval.window_days // 5) | tostring
  secrets:
    SESSION_SECRET:
      title: Session signing secret
      description: Signs the acting-as tokens the UI sends with every decision. Generate with `openssl rand -hex 32`.
      required: true

ui:
  ui:order:
    - image
    - replicas
    - resources
    - path
    - events_topic
    - max_days_per_request
    - approval
    - "*"
  image:
    ui:order:
      - repository
      - tag
    tag:
      ui:help: Pick the release you want. Rolling back is redeploying an older tag.
  replicas:
    ui:widget: updown
  resources:
    ui:order:
      - cpu
      - memory_mb
  max_days_per_request:
    ui:widget: updown
    ui:help: Company policy, enforced by the API on every submission.
  approval:
    ui:order:
      - auto_approve
      - window_days
