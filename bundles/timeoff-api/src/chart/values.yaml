name: web-service
labels: {}
image: ""
replicas: 1
port: 8080
healthPath: /healthz
# Numeric UID the image runs as; needed when the image names its user instead of numbering it.
runAsUser: null
resources:
  cpu: 0.25
  memoryMb: 256
env: {}
secrets: {}
ingress:
  className: nginx
  host: ""
  path: /
# emptyDir mounts for images that must write somewhere despite a read-only root.
writableDirs: []
