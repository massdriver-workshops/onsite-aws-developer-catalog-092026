name: timeoff

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: timeoff
      MARIADB_USER: timeoff
      MARIADB_PASSWORD: timeoff
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rpk topic create local.timeoff.decisions -p 3 --brokers redpanda:9092 || true

  timeoff-api:
    build: ./apps/timeoff-api
    depends_on:
      mariadb:
        condition: service_healthy
      topics:
        condition: service_completed_successfully
    environment:
      BASE_PATH: /local/api/timeoff
      NAMESPACE: local
      COMPANY_NAME: Northwind Staffing
      DATABASE_URL: mysql://timeoff:timeoff@mariadb:3306/timeoff
      SESSION_SECRET: local-dev-secret
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: local.timeoff.decisions
      KAFKA_TLS: "false"
      MAX_DAYS_PER_REQUEST: "30"
      APPROVAL_WINDOW_DAYS: "5"

  payroll-api:
    build: ./apps/payroll-api
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      BASE_PATH: /local/api/payroll
      NAMESPACE: local
      PAYMENTS_API_KEY: demo-payments-key-7f3a
      PAY_PERIOD: biweekly
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: local.timeoff.decisions
      KAFKA_CONSUMER_GROUP: local-payroll
      KAFKA_TLS: "false"

  timeoff-ui:
    build: ./apps/timeoff-ui
    environment:
      BASE_PATH: /local
      NAMESPACE: local

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./local/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - timeoff-api
      - payroll-api
      - timeoff-ui
