apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "ws.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "ws.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ws.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.env | sha256sum }}
        {{- if .Values.secrets }}
        checksum/secrets: {{ toJson .Values.secrets | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- if .Values.runAsUser }}
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.secrets }}
          envFrom:
            - secretRef:
                name: {{ .Values.name }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: {{ .Values.resources.cpu }}
              memory: {{ .Values.resources.memoryMb }}Mi
            limits:
              cpu: {{ .Values.resources.cpu }}
              memory: {{ .Values.resources.memoryMb }}Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.writableDirs }}
          volumeMounts:
            {{- range $i, $dir := .Values.writableDirs }}
            - name: writable-{{ $i }}
              mountPath: {{ $dir }}
            {{- end }}
          {{- end }}
      {{- if .Values.writableDirs }}
      volumes:
        {{- range $i, $dir := .Values.writableDirs }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
      {{- end }}
